[workspace]
resolver = "2"
members = ["crates/brigalow-core", "crates/brigalow-server", "crates/brig"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yumaitau/brigalow"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
