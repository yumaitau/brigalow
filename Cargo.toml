[workspace]
resolver = "2"
members = ["crates/brigalow-postgres", "crates/brigalow-pkcs11", "crates/brigalow-core", "crates/brigalow-server", "crates/brigalow-store", "crates/brigalow-crypto", "crates/brig"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yumaitau/brigalow"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
sqlx = { package = "brigalow-postgres", path = "crates/brigalow-postgres" }

[workspace.lints.rust]
unsafe_code = "forbid"
