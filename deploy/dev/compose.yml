# Disposable local test infrastructure. Run through scripts/e2e.sh.
services:
  postgres:
    networks: [default, tool-tests]
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: brigalow
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cp /run/secrets/server_key /tmp/server.key
        cp /run/secrets/server_cert /tmp/server.crt
        chown postgres:postgres /tmp/server.key /tmp/server.crt
        chmod 0600 /tmp/server.key
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key
    secrets:
      - postgres_password
      - server_key
      - server_cert
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brigalow"]
      interval: 1s
      timeout: 3s
      retries: 60
  softhsm:
    build:
      context: ../..
      dockerfile: deploy/dev/SoftHSM.Dockerfile
    command: ["sleep", "infinity"]
    tmpfs:
      - /var/lib/softhsm/tokens
    healthcheck:
      test: ["CMD", "softhsm2-util", "--show-slots"]
      interval: 1s
      timeout: 3s
      retries: 30
  idp:
    networks: [default, tool-tests]
    build:
      context: .
      dockerfile: IdP.Dockerfile
    secrets: [server_key, server_cert]
    ports: ["127.0.0.1::8443"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1',8443),2).close()"]
      interval: 1s
      timeout: 3s
      retries: 30
  tsa:
    networks: [default, tool-tests]
    build:
      context: .
      dockerfile: TSA.Dockerfile
    secrets: [server_key, server_cert, tsa_key, tsa_cert, tsa_ca]
    ports: ["127.0.0.1::8443"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1',8443),2).close()"]
      interval: 1s
      timeout: 3s
      retries: 30

  tools:
    networks: [tool-tests]
    profiles: [tools]
    build:
      context: ../..
      dockerfile: deploy/dev/Tools.Dockerfile
    volumes:
      - ${BRIGALOW_TEST_SECRETS:?run scripts/e2e.sh}:/test-secrets:ro
      - ${BRIGALOW_RELEASE_DIR:?run scripts/e2e.sh}:/release-artifacts
    environment:
      BRIGALOW_TEST_RELEASE_DIR: /release-artifacts
      BRIGALOW_TEST_SECRETS: /test-secrets
      BRIGALOW_TEST_DB_HOST: postgres
      BRIGALOW_TEST_DB_PORT: "5432"
      BRIGALOW_TEST_DB_CA_FILE: /test-secrets/ca.crt
      BRIGALOW_TEST_ADMIN_PASSWORD_FILE: /test-secrets/postgres_password
      BRIGALOW_TEST_APP_PASSWORD_FILE: /test-secrets/app_password
      BRIGALOW_TEST_IDP_URL: https://idp:8443
      BRIGALOW_TEST_TSA_URL: https://tsa:8443
      BRIGALOW_TEST_TLS_CERT_FILE: /test-secrets/server.crt
      BRIGALOW_TEST_TLS_KEY_FILE: /test-secrets/server.key

secrets:
  postgres_password:
    file: ${BRIGALOW_TEST_SECRETS:?run scripts/e2e.sh}/postgres_password
  server_key:
    file: ${BRIGALOW_TEST_SECRETS:?run scripts/e2e.sh}/server.key
  server_cert:
    file: ${BRIGALOW_TEST_SECRETS:?run scripts/e2e.sh}/server.crt

  tsa_key:
    file: ${BRIGALOW_TEST_SECRETS:?run scripts/e2e.sh}/tsa.key
  tsa_cert:
    file: ${BRIGALOW_TEST_SECRETS:?run scripts/e2e.sh}/tsa.pem
  tsa_ca:
    file: ${BRIGALOW_TEST_SECRETS:?run scripts/e2e.sh}/ca.crt

networks:
  default: {}
  tool-tests:
    internal: true
