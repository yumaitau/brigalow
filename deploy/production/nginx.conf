pid /tmp/nginx.pid;
worker_processes 2;
# Request URLs can carry OIDC codes. Proxy request/error logs stay disabled.
error_log /dev/null;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    large_client_header_buffers 2 8k;
    limit_req_zone $binary_remote_addr zone=ingress:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    server {
        listen 8443 ssl;
        ssl_certificate /run/tls/tls.crt;
        ssl_certificate_key /run/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        limit_req zone=ingress burst=20 nodelay;
        limit_req_status 429;
        limit_conn connections 30;
        limit_conn_status 429;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location / {
            proxy_pass http://server:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 15s;
            proxy_next_upstream off;
        }
    }
}
