name: lab-signed release bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build and package Linux artifacts with SBOM
        run: |
          cargo build --release --locked --workspace
          python3 scripts/package_release.py --binaries target/release --output dist
      - name: Sign manifest through ephemeral lab control plane and run acceptance
        env:
          BRIGALOW_RELEASE_DIR: ${{ github.workspace }}/dist
        run: scripts/e2e.sh --context default
      - name: Independently verify lab manifest and payloads
        run: python3 scripts/verify_release.py dist --public-key dist/lab-public.pem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brigalow-linux-lab-signed
          path: dist/
          if-no-files-found: error
          retention-days: 14
