[package]
name = "brigalow-server"
default-run = "brigalow-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
der = { version = "0.7", features = ["pem"] }
x509-cert = "0.2.5"
time = {version="0.3",features=["formatting"]}
brigalow-crypto = { path = "../brigalow-crypto" }
brigalow-core = { path = "../brigalow-core" }
brigalow-store = { path = "../brigalow-store" }
axum = "0.8"
tokio.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
toml = "0.8"
zeroize = "1"
libc = "0.2"

uuid.workspace = true
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
oauth2 = { version = "5", default-features = false }
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
url = "2"
futures-util = "0.3"

[features]
integration = []
tool-tests = ["integration"]

[dev-dependencies]
cms = "0.2.3"
der = "0.7"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

tempfile.workspace = true
uuid.workspace = true
