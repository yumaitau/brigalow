{% extends "base.html" %}
{% block title %}Complete sign-in · Brigalow{% endblock %}
{% block main_class %} centre{% endblock %}
{% block content %}
<section class="panel">
<div class="panel-header"><h1>Complete sign-in</h1><p class="muted">Continue on this site to finish your secure sign-in.</p></div>
<form method="post" action="/auth/{{ org }}/{{ provider }}/complete"><input type="hidden" name="state" value="{{ state }}"><input type="hidden" name="code" value="{{ code }}"><button data-slot="button" data-variant="solid" type="submit">Continue</button></form>
</section>
{% endblock %}
